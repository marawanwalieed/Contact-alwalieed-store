<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">  <title>Contact Us</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0d47a1, #1a237e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.16);
      text-align: center;
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 28px;
      color: #dce6ff;
      line-height: 1.6;
    }
    .buttons {
      display: grid;
      gap: 16px;
    }
    .btn i{
    font-size:24px;
}
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      text-decoration: none;
      color: #fff;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.18);
    }
    .facebook {
      background: #1877f2;
    }
    .whatsapp {
      background: #25d366;
      color: #0b3c23;
    }
    .icon {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .call{
background: #033b03

    }
  </style>
</head>
<body>
  <div class="container">
    <h1>للتواصل ⬇️</h1>
    <p>اختر الطريقة التي تود الاتصال بها. انقر على الأيقونة أدناه للذهاب إلى فيسبوك أو واتساب.</p>
    <div class="buttons">
      <a class="btn call"
      href="tel:+201106900233">
        <i class="fa-solid fa-phone"></i>
        Call Us
      </a>
      <a class="btn facebook"
   href="https://www.facebook.com/share/1JxA7h1prM/"
   target="_blank">
    <i class="fa-brands fa-facebook-f"></i>
    Facebook
</a>
    <a class="btn whatsapp"
   href="https://wa.me/201106900233"
   target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
    WhatsApp
</a>
    </div>
  </div>
</body>
</html>
